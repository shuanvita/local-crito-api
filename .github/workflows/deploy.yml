name: Deploy CMS to nuxt.rucode.net

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crito
          POSTGRES_PASSWORD: crito
          POSTGRES_DB: crito
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crito"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export PATH="/home/${{ secrets.SSH_USER }}/.nvm/versions/node/v24.21.0/bin:$PATH"
            bash /var/www/crito/deploy/deploy.sh
