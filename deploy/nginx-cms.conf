# Фрагмент для существующего server { ... } сайта nuxt.rucode.net (listen 443 ssl и остальное уже есть).
# Вставьте перед location /, который отдаёт сайт. Порты: API 3200, админка 3100 (сайт rucode: 3000).

# Админка под basic auth. Её прокси подставляет служебный токен API, поэтому вход через nginx
# это единственная защита админки: не отключайте auth_basic.
location = /admin { return 301 /admin/; }
location ^~ /admin/ {
    auth_basic           "CMS";
    auth_basic_user_file /etc/nginx/.htpasswd-crito;

    client_max_body_size 25m;        # файлы медиатеки до 20 МБ
    proxy_pass           http://127.0.0.1:3100;
    proxy_set_header     Host $host;
    proxy_set_header     X-Forwarded-For $remote_addr;
    proxy_set_header     X-Forwarded-Proto $scheme;
}

# Публичная часть API: страницы для сайта, файлы медиатеки, проверка живости.
# Ссылки на файлы в страницах строятся от PUBLIC_BASE_URL=https://nuxt.rucode.net/cms-api.
location ^~ /cms-api/public/ { proxy_pass http://127.0.0.1:3200/public/; proxy_set_header Host $host; }
location ^~ /cms-api/media/  { proxy_pass http://127.0.0.1:3200/media/;  proxy_set_header Host $host; }
location = /cms-api/health   { proxy_pass http://127.0.0.1:3200/health;  proxy_set_header Host $host; }

# Загрузка манифеста из CI сайта: только PUT, защищена ключом CI (x-ci-key) на стороне API.
location ~ ^/cms-api/projects/[a-z0-9-]+/manifest$ {
    limit_except PUT { deny all; }
    client_max_body_size 6m;         # лимит JSON-тела API: 5 МБ
    rewrite ^/cms-api/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3200;
    proxy_set_header Host $host;
}

# Всё остальное в API снаружи недоступно (проекты, страницы, медиатека доступны только через /admin).
location ^~ /cms-api/ { return 404; }
